[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-maneuver-optimizer"
version = "0.1.0"
description = "Compare Hohmann and bi-elliptic orbit transfers (planar and non-coplanar): delta-v, propellant and timing, with simulation and plots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["orbital mechanics", "astrodynamics", "hohmann", "bi-elliptic", "delta-v", "mission planning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orbit-maneuvers = "orbit_maneuvers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
